[project]
name = "fastapi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "motor==3.7.1",
    "pymongo==4.18.2",
    "pydantic==2.13.5",
    "slowapi==0.1.10",
    "bcrypt==5.0.0",
    "PyJWT==2.15.0",
]
 
[tool.fastapi]
entrypoint = "app.main:app"
 
[tool.uv]
package = false
